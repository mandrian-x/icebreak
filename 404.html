<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050806">
  <title>ICEBREAK // 404</title>
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #050806;
      color: #eef2ee;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      position: relative;
      isolation: isolate;
    }
    .error-page::before {
      content: "";
      position: absolute;
      inset: 8% 18%;
      background: radial-gradient(circle, rgba(186,255,120,.12), transparent 58%);
      filter: blur(30px);
      z-index: -1;
      pointer-events: none;
    }
    .error-wrap {
      width: min(980px, 100%);
      text-align: center;
    }
    .error-logo {
      display: inline-flex;
      margin-bottom: 42px;
    }
    .error-logo img {
      width: min(230px, 58vw);
      height: auto;
      display: block;
    }
    .error-code {
      margin: 0;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      font-size: clamp(120px, 25vw, 270px);
      line-height: .78;
      letter-spacing: -.055em;
      color: #eef2ee;
    }
    .error-code span { color: #baff78; }
    .error-kicker {
      margin: 38px 0 10px;
      color: #baff78;
      font: 11px/1.2 monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .error-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -.04em;
    }
    .error-copy {
      max-width: 590px;
      margin: 20px auto 32px;
      color: #8e9a8c;
      font-size: 17px;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .error-actions a {
      min-width: 170px;
      padding: 15px 22px;
      border: 1px solid rgba(186,255,120,.28);
      border-radius: 9px;
      color: #baff78;
      text-decoration: none;
      font: 700 11px/1 monospace;
      letter-spacing: 1px;
      transition: .2s ease;
    }
    .error-actions a:first-child {
      background: #baff78;
      border-color: #baff78;
      color: #050806;
    }
    .error-actions a:hover {
      transform: translateY(-2px);
      border-color: #baff78;
    }
    .error-footer {
      margin-top: 58px;
      color: #4f5a4e;
      font: 10px monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @media (max-width: 600px) {
      .error-page { padding: 28px 18px; }
      .error-logo { margin-bottom: 30px; }
      .error-copy { font-size: 15px; }
      .error-actions a { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-wrap">
      <a class="error-logo" href="index.html" aria-label="ICEBREAK home">
        <img src="assets/icebreak-logo.png" alt="ICEBREAK">
      </a>

      <p class="error-code">4<span>0</span>4</p>
      <p class="error-kicker">MISSION NOT FOUND</p>
      <h1 class="error-title">Looks like you took a wrong turn.</h1>
      <p class="error-copy">
        This page doesn't exist, may have moved, or the link you followed is no longer active.
        The game is still on.
      </p>

      <div class="error-actions">
        <a href="index.html">RETURN HOME →</a>
        <a href="leaderboard.html">VIEW LEADERBOARD →</a>
      </div>

      <p class="error-footer">ICEBREAK // PLAY · COMPLETE · RISE</p>
    </div>
  </main>
</body>
</html>
